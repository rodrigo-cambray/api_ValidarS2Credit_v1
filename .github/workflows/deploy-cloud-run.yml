name: Deploy Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: cloud-run-production
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      ARTIFACT_REPOSITORY: ${{ secrets.ARTIFACT_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      CLOUD_RUN_ALLOW_UNAUTHENTICATED: ${{ secrets.CLOUD_RUN_ALLOW_UNAUTHENTICATED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE ARTIFACT_REPOSITORY
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT
            CLOUD_RUN_ALLOW_UNAUTHENTICATED
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing GitHub Environment secret::$name is required"
              exit 1
            fi
          done
          case "$CLOUD_RUN_ALLOW_UNAUTHENTICATED" in
            true) echo "CLOUD_RUN_ACCESS_FLAG=--allow-unauthenticated" >> "$GITHUB_ENV" ;;
            false) echo "CLOUD_RUN_ACCESS_FLAG=--no-allow-unauthenticated" >> "$GITHUB_ENV" ;;
            *) echo "::error title=Invalid public access setting::CLOUD_RUN_ALLOW_UNAUTHENTICATED must be true or false"; exit 1 ;;
          esac
          echo "IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Decode and validate private runtime environment
        shell: bash
        env:
          CLOUD_RUN_ENV_FILE_B64: ${{ secrets.CLOUD_RUN_ENV_FILE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUD_RUN_ENV_FILE_B64" ]]; then
            echo "::error title=Missing GitHub Environment secret::CLOUD_RUN_ENV_FILE_B64 is required"
            exit 1
          fi
          printf '%s' "$CLOUD_RUN_ENV_FILE_B64" | base64 --decode > deploy/cloud-run.env
          chmod 600 deploy/cloud-run.env
          required=(MYSQL_HOST MYSQL_PORT MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD BEARER_TOKEN)
          for name in "${required[@]}"; do
            if ! grep -qE "^${name}=.+" deploy/cloud-run.env; then
              echo "::error title=Missing runtime variable::$name is required in CLOUD_RUN_ENV_FILE_B64"
              exit 1
            fi
          done

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and publish image
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "$IMAGE" \
            --env-vars-file deploy/cloud-run.env \
            "$CLOUD_RUN_ACCESS_FLAG" \
            --quiet

      - name: Remove private runtime environment
        if: always()
        run: rm -f deploy/cloud-run.env
